# AZ Mail frontend (static SPA) — Nginx site (docs/DEPLOY.md).
# Install: cp deploy/nginx-frontend.conf /etc/nginx/sites-available/azmail-web.conf
#          ln -s ../sites-available/azmail-web.conf /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
# Web root: /var/www/azmail (contents of frontend/dist). /var/www/azmail/config.js is
# environment-specific:  window.__AZMAIL_CONFIG__ = { apiBase: "https://mail-api.example.com" };
# Replace mail.example.com / mail-api.example.com (also in the CSP connect-src) and the
# certificate paths. This file is included inside http {}.

# Cache policy per path (one add_header at server level keeps the security headers inherited):
# index.html and config.js are never cached; hashed /assets/* are immutable.
map $uri $azmail_cache_control {
    default                 "no-cache";
    /index.html             "no-store";
    /config.js              "no-store";
    ~^/assets/              "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Ubuntu 24.04 ships nginx 1.24 (no "http2 on;" directive before 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.example.com;

    ssl_certificate     /etc/letsencrypt/live/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:azmail_web:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/azmail;
    index index.html;
    charset utf-8;

    # Strict app CSP (DESIGN D3/E4, §7): scripts only from this origin (the token lives in
    # localStorage); img-src https: because sandboxed email iframes (srcdoc) inherit this policy
    # and restrict images themselves; connect-src = the API over HTTPS and WSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://mail-api.example.com wss://mail-api.example.com; font-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $azmail_cache_control always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    # Per-environment runtime config (API base URL).
    location = /config.js {
        try_files $uri =404;
    }

    # Content-hashed build output.
    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # SPA: client-side routes (/mail/inbox, /settings/general, …) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
