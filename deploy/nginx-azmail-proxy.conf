# AZ Mail API — proxy headers shared by every proxied location (docs/DEPLOY.md §9).
# Install: install -m 0644 deploy/nginx-azmail-proxy.conf /etc/nginx/snippets/azmail-proxy.conf
# Used by:  include /etc/nginx/snippets/azmail-proxy.conf;   (inside each location of nginx-api.conf)
#
# Why a snippet and not server-level directives: nginx inherits proxy_set_header from the enclosing
# level ONLY when the current level defines none. Every AZ Mail location sets its own header
# (Upgrade/Connection for /api/ws, `Connection ""` for upstream keep-alive), so server-level lines
# would be silently dropped there and the backend would see every client as 127.0.0.1 — one shared
# login-throttle bucket for the whole team (AZMAIL_LOGIN_MAX_PER_IP) and 127.0.0.1 in the audit log.
#
# X-Forwarded-For is OVERWRITTEN with $remote_addr (not $proxy_add_x_forwarded_for): nginx is the
# edge, so a client-supplied X-Forwarded-For must never reach the backend, which trusts this header
# from AZMAIL_TRUSTED_PROXIES (127.0.0.1). If a CDN or load balancer sits in front of nginx, configure
# ngx_http_realip_module (set_real_ip_from <its ranges>; real_ip_header X-Forwarded-For;) so that
# $remote_addr is the real client before it gets here.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
