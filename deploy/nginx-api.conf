# AZ Mail API — Nginx reverse proxy (docs/DEPLOY.md).
# Install: install -m 0644 deploy/nginx-azmail-proxy.conf /etc/nginx/snippets/azmail-proxy.conf
#          cp deploy/nginx-api.conf /etc/nginx/sites-available/azmail-api.conf
#          ln -s ../sites-available/azmail-api.conf /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
# Replace mail-api.example.com and the certificate paths. This file is included inside http {}.

# WebSocket upgrade: "Connection: upgrade" only when the client asked for it.
map $http_upgrade $azmail_connection_upgrade {
    default upgrade;
    ''      close;
}

# Access log without query strings: signed file URLs carry their signature in the query
# (DESIGN D5: never log signed-URL query strings).
log_format azmail_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream azmail_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mail-api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Ubuntu 24.04 ships nginx 1.24 (no "http2 on;" directive before 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/mail-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail-api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:azmail_api:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/azmail-api.access.log azmail_noquery;
    # The error log cannot drop query strings: upstream errors carry `request: "GET /…?…"`. Only
    # /api/files/ URLs hold signatures, so that location logs at `crit` (see below).
    error_log  /var/log/nginx/azmail-api.error.log warn;

    # Uploads are 25 MiB per file (AZMAIL_UPLOAD_LIMIT); leave headroom. The backend streams the
    # body to disk itself, so don't buffer it here.
    client_max_body_size 30m;
    client_body_timeout 60s;
    proxy_request_buffering off;

    # JSON compression is done here (the backend never compresses).
    gzip on;
    gzip_proxied any;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_vary on;

    # Shared proxy settings. NO proxy_set_header at this level: nginx inherits proxy_set_header only
    # into locations that define none, and every location below defines its own. Each proxied
    # location therefore includes the snippet with Host / X-Real-IP / X-Forwarded-For /
    # X-Forwarded-Proto (deploy/nginx-azmail-proxy.conf). The backend trusts X-Forwarded-For only
    # from AZMAIL_TRUSTED_PROXIES (127.0.0.1) and uses it for the per-IP login throttle and audit log.
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;

    # WebSocket: long-lived; the server pings, the client reconnects with backoff.
    location = /api/ws {
        proxy_pass http://azmail_backend;
        include /etc/nginx/snippets/azmail-proxy.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $azmail_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Resend webhooks (Svix-signed, ≤ 1 MiB).
    location = /api/webhooks/resend {
        client_max_body_size 1m;
        proxy_pass http://azmail_backend;
        include /etc/nginx/snippets/azmail-proxy.conf;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Attachment / raw downloads may be streamed from R2 in proxy mode (slow cross-border links).
    # These URLs carry a valid signature in the query string (…?u=&exp=&sig=, up to 12 h). nginx
    # writes the full request line into error-log entries (upstream timeouts, resets, 502 during a
    # backend restart), so routine errors here are not logged at all — DESIGN D5: never log
    # signed-URL query strings. The backend journal still records download failures without them.
    location /api/files/ {
        error_log /var/log/nginx/azmail-api.error.log crit;
        proxy_pass http://azmail_backend;
        include /etc/nginx/snippets/azmail-proxy.conf;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_max_temp_file_size 0;
    }

    location /api/ {
        proxy_pass http://azmail_backend;
        include /etc/nginx/snippets/azmail-proxy.conf;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        return 404;
    }
}
